<text class="mono" x="536" y="286" text-anchor="start" fill="#3A3430" font-size="13" letter-spacing="2.5">TRANSCRIPT · WHISPER · ON DEVICE</text>
<g clip-path="url(#ticker)" class="mono" font-size="15"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -240" dur="19.0s" repeatCount="indefinite"/><text x="536" y="314" fill="#E5322D">▸</text><text x="556" y="314" fill="#8A837A">00:00</text><text x="616" y="314" fill="#F3ECE2">So the duplicates all come from the same worker.</text><text x="536" y="338" fill="#E5322D">▸</text><text x="556" y="338" fill="#8A837A">00:06</text><text x="616" y="338" fill="#F3ECE2">Every one of them on the fifth attempt.</text><text x="536" y="362" fill="#E5322D">▸</text><text x="556" y="362" fill="#8A837A">00:14</text><text x="616" y="362" fill="#F3ECE2">Right, and we never mark the row as consumed.</text><text x="536" y="386" fill="#E5322D">▸</text><text x="556" y="386" fill="#8A837A">00:21</text><text x="616" y="386" fill="#F3ECE2">So the retry writes it again.</text><text x="536" y="410" fill="#E5322D">▸</text><text x="556" y="410" fill="#8A837A">00:27</text><text x="616" y="410" fill="#F3ECE2">Then the fix is the backoff, not the dedupe.</text><text x="536" y="434" fill="#E5322D">▸</text><text x="556" y="434" fill="#8A837A">00:34</text><text x="616" y="434" fill="#F3ECE2">Exponential, and a dead letter after the third.</text><text x="536" y="458" fill="#E5322D">▸</text><text x="556" y="458" fill="#8A837A">00:41</text><text x="616" y="458" fill="#F3ECE2">What about the alert threshold?</text><text x="536" y="482" fill="#E5322D">▸</text><text x="556" y="482" fill="#8A837A">00:45</text><text x="616" y="482" fill="#F3ECE2">Leave it. Separate ticket.</text><text x="536" y="506" fill="#E5322D">▸</text><text x="556" y="506" fill="#8A837A">00:52</text><text x="616" y="506" fill="#F3ECE2">Fine. Can you drop the frames in the note?</text><text x="536" y="530" fill="#E5322D">▸</text><text x="556" y="530" fill="#8A837A">00:58</text><text x="616" y="530" fill="#F3ECE2">Already there, it files itself on stop.</text><text x="536" y="554" fill="#E5322D">▸</text><text x="556" y="554" fill="#8A837A">00:00</text><text x="616" y="554" fill="#F3ECE2">So the duplicates all come from the same worker.</text><text x="536" y="578" fill="#E5322D">▸</text><text x="556" y="578" fill="#8A837A">00:06</text><text x="616" y="578" fill="#F3ECE2">Every one of them on the fifth attempt.</text><text x="536" y="602" fill="#E5322D">▸</text><text x="556" y="602" fill="#8A837A">00:14</text><text x="616" y="602" fill="#F3ECE2">Right, and we never mark the row as consumed.</text><text x="536" y="626" fill="#E5322D">▸</text><text x="556" y="626" fill="#8A837A">00:21</text><text x="616" y="626" fill="#F3ECE2">So the retry writes it again.</text><text x="536" y="650" fill="#E5322D">▸</text><text x="556" y="650" fill="#8A837A">00:27</text><text x="616" y="650" fill="#F3ECE2">Then the fix is the backoff, not the dedupe.</text><text x="536" y="674" fill="#E5322D">▸</text><text x="556" y="674" fill="#8A837A">00:34</text><text x="616" y="674" fill="#F3ECE2">Exponential, and a dead letter after the third.</text><text x="536" y="698" fill="#E5322D">▸</text><text x="556" y="698" fill="#8A837A">00:41</text><text x="616" y="698" fill="#F3ECE2">What about the alert threshold?</text><text x="536" y="722" fill="#E5322D">▸</text><text x="556" y="722" fill="#8A837A">00:45</text><text x="616" y="722" fill="#F3ECE2">Leave it. Separate ticket.</text><text x="536" y="746" fill="#E5322D">▸</text><text x="556" y="746" fill="#8A837A">00:52</text><text x="616" y="746" fill="#F3ECE2">Fine. Can you drop the frames in the note?</text><text x="536" y="770" fill="#E5322D">▸</text><text x="556" y="770" fill="#8A837A">00:58</text><text x="616" y="770" fill="#F3ECE2">Already there, it files itself on stop.</text></g></g>
