<text class="mono" x="879.0" y="118" text-anchor="middle" fill="#F3ECE2" font-size="21" font-weight="700">$RECORD_AI</text>
<text class="mono" x="879.0" y="145" text-anchor="middle" fill="#8A837A" font-size="14">title · tags · summary</text>
<text class="mono" x="879.0" y="192" text-anchor="middle" fill="#E5322D" font-size="14" letter-spacing="2.5">OPTIONAL</text>
