<circle r="3.5" fill="#8A837A"><animateMotion dur="4.5s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M738 122 C798 122 808 62 879 62 S960 122 1020 122"/></circle><circle r="7.700000000000001" fill="#8A837A" opacity=".16"><animateMotion dur="4.5s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M738 122 C798 122 808 62 879 62 S960 122 1020 122"/></circle>
<text class="mono" x="64" y="238" text-anchor="start" fill="#3A3430" font-size="13" letter-spacing="2.5">ONE MP4 PER HOUR · NOTHING RUNS UNTIL YOU PRESS IT</text>
<text class="mono" x="1216" y="238" text-anchor="end" fill="#3A3430" font-size="13" letter-spacing="2.5">THE GREY DOT IS RECORD_AI=0</text>
