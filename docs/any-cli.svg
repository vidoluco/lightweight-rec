<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="One config line, RECORD_AI, picks which CLI writes the title, tags, summary and screen description: Claude Code, Cursor CLI or Copilot CLI. The note is the same either way.">
<title>Plug any CLI</title>
<style>
  .mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;}
  .serif{font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
  .live{animation:pulse 1.4s ease-in-out infinite}
  @keyframes ring{0%{r:6;opacity:.9}100%{r:18;opacity:0}}
  .ring{animation:ring 1.4s ease-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes fadein{from{fill-opacity:0}to{fill-opacity:1}}
  .l{fill-opacity:0;animation:fadein .7s ease-out forwards}
  @keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(384px)}}
  .scan{animation:scan 9s linear infinite}
  @keyframes press{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(3px)}}
  .key{animation:press 3.6s ease-in-out infinite}
  @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  .glow{animation:glow 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1280" height="380" fill="#0F0D0C"/>
<g stroke="#2A2522" stroke-width="2" fill="none"><path d="M28 60 V28 H60"/><path d="M1252 60 V28 H1220"/><path d="M28 320 V352 H60"/><path d="M1252 320 V352 H1220"/></g>
<text class="mono" x="64" y="52" text-anchor="start" fill="#8A837A" font-size="15" letter-spacing="2.5">ONE CONFIG LINE</text>
<text class="mono" x="1216" y="52" text-anchor="end" fill="#8A837A" font-size="15" letter-spacing="2.5">SWAP THE CLI, KEEP THE NOTE</text>
<text class="mono" x="658.0" y="98" text-anchor="end" fill="#8A837A" font-size="26">RECORD_AI=</text>
<g class="mono" font-size="26" font-weight="700" fill="#F3ECE2">
<g opacity="1"><text x="658.0" y="98">claude<tspan class="cursor">▍</tspan></text><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><text x="658.0" y="98">cursor<tspan class="cursor">▍</tspan></text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><text x="658.0" y="98">copilot<tspan class="cursor">▍</tspan></text><animate attributeName="opacity" values="0;1" keyTimes="0;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></g>
</g>
<path d="M332 120 C442 120 390 200.0 500 200.0" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#E5322D;#2A2522" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></path>
<path d="M332 200 C442 200 390 200.0 500 200.0" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#2A2522;#E5322D;#2A2522" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></path>
<path d="M332 280 C442 280 390 200.0 500 200.0" fill="none" stroke="#2A2522" stroke-width="2" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#2A2522;#E5322D" keyTimes="0;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></path>
<path d="M800 200.0 C890 200.0 902 200 992 200" fill="none" stroke="#2A2522" stroke-width="2.0" stroke-dasharray="5 6"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="0.9s" repeatCount="indefinite"/></path>
<rect x="64" y="88.0" width="268" height="64" rx="10" fill="#161311" stroke="#2A2522" stroke-width="1.5"><animate attributeName="stroke" values="#E5322D;#2A2522" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></rect>
<text class="mono" x="82" y="117" fill="#F3ECE2" font-size="19" font-weight="700">claude code</text>
<text class="mono" x="82" y="139" fill="#8A837A" font-size="12">sonnet · haiku</text>
<text class="mono" x="316" y="117" text-anchor="end" fill="#3A3430" font-size="11" letter-spacing="2">ANTHROPIC</text>
<rect x="64" y="168.0" width="268" height="64" rx="10" fill="#161311" stroke="#2A2522" stroke-width="1.5"><animate attributeName="stroke" values="#2A2522;#E5322D;#2A2522" keyTimes="0;0.3333;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></rect>
<text class="mono" x="82" y="197" fill="#F3ECE2" font-size="19" font-weight="700">cursor cli</text>
<text class="mono" x="82" y="219" fill="#8A837A" font-size="12">cursor grok 4.6</text>
<text class="mono" x="316" y="197" text-anchor="end" fill="#3A3430" font-size="11" letter-spacing="2">CURSOR</text>
<rect x="64" y="248.0" width="268" height="64" rx="10" fill="#161311" stroke="#2A2522" stroke-width="1.5"><animate attributeName="stroke" values="#2A2522;#E5322D" keyTimes="0;0.6667" calcMode="discrete" dur="9.0s" begin="0s" repeatCount="indefinite"/></rect>
<text class="mono" x="82" y="277" fill="#F3ECE2" font-size="19" font-weight="700">copilot cli</text>
<text class="mono" x="82" y="299" fill="#8A837A" font-size="12">gemini 3.8 flash</text>
<text class="mono" x="316" y="277" text-anchor="end" fill="#3A3430" font-size="11" letter-spacing="2">GITHUB</text>
<rect class="glow" x="500" y="150" width="300" height="100" rx="14" fill="#161311" stroke="#E5322D" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="mono" x="650.0" y="194" text-anchor="middle" fill="#F3ECE2" font-size="20" font-weight="700">title · tags · summary</text>
<text class="mono" x="650.0" y="220" text-anchor="middle" fill="#8A837A" font-size="14">and what was on screen</text>
<text class="mono" x="650.0" y="276" text-anchor="middle" fill="#E5322D" font-size="13" letter-spacing="2.5">OPTIONAL · PAID · OFF-MACHINE</text>
<rect class="" x="992" y="168.0" width="224" height="64" rx="10" fill="#161311" stroke="#2A2522" stroke-width="1.5"/><text class="mono" x="1010" y="197" fill="#F3ECE2" font-size="19" font-weight="700">note.md</text><text class="mono" x="1010" y="219" fill="#8A837A" font-size="12">same note, any CLI</text>
<text class="mono" x="1104.0" y="258.0" text-anchor="middle" fill="#5E8F5A" font-size="13" letter-spacing="2.5">IN YOUR VAULT</text>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="0.0s" repeatCount="indefinite"/><circle r="4.5" fill="#E5322D"><animateMotion dur="9.0s" begin="0.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 120 C442 120 390 200.0 500 200.0"/></circle><circle r="9.9" fill="#E5322D" opacity=".16"><animateMotion dur="9.0s" begin="0.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 120 C442 120 390 200.0 500 200.0"/></circle></g>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="3.0s" repeatCount="indefinite"/><circle r="4.5" fill="#E5322D"><animateMotion dur="9.0s" begin="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 200 C442 200 390 200.0 500 200.0"/></circle><circle r="9.9" fill="#E5322D" opacity=".16"><animateMotion dur="9.0s" begin="3.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 200 C442 200 390 200.0 500 200.0"/></circle></g>
<g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="9.0s" begin="6.0s" repeatCount="indefinite"/><circle r="4.5" fill="#E5322D"><animateMotion dur="9.0s" begin="6.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 280 C442 280 390 200.0 500 200.0"/></circle><circle r="9.9" fill="#E5322D" opacity=".16"><animateMotion dur="9.0s" begin="6.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3333;1" path="M332 280 C442 280 390 200.0 500 200.0"/></circle></g>
<circle r="4" fill="#F3ECE2"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M800 200.0 C890 200.0 902 200 992 200"/></circle><circle r="8.8" fill="#F3ECE2" opacity=".16"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" path="M800 200.0 C890 200.0 902 200 992 200"/></circle>
<text class="mono" x="64" y="358" text-anchor="start" fill="#3A3430" font-size="13" letter-spacing="2.5">RECORD_AI=0 MAKES NO CALL AT ALL</text>
<text class="mono" x="1216" y="358" text-anchor="end" fill="#3A3430" font-size="13" letter-spacing="2.5">CAPTURE AND TRANSCRIPT NEVER LEAVE THE MAC</text>
</svg>