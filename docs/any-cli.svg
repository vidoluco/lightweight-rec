<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="One config line, RECORD_AI, picks what writes the title, tags, summary and screen description: Claude Code, Cursor CLI, Copilot CLI, or any model server that speaks the chat completions protocol, Ollama and LM Studio on this Mac included. The note is the same either way.">
<title>A CLI or a model of your own</title>
<style>
  .mono{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;}
  .serif{font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
  .live{animation:pulse 1.4s ease-in-out infinite}
  @keyframes ring{0%{r:6;opacity:.9}100%{r:18;opacity:0}}
  .ring{animation:ring 1.4s ease-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes fadein{from{fill-opacity:0}to{fill-opacity:1}}
  .l{fill-opacity:0;animation:fadein .7s ease-out forwards}
  @keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(604px)}}
  .scan{animation:scan 9s linear infinite}
  @keyframes press{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(3px)}}
  .key{animation:press 3.6s ease-in-out infinite}
  @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  .glow{animation:glow 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
